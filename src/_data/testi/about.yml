de:
  title: Über <span>mich</span>
  intro: Im Grunde ein <i>Geek</i>. Ich finde gerne <b>clevere Lösungen</b> für die Probleme der Menschen. Ich bin extrem neugierig und <small><small>übertrieben</small></small> organisiert. Leidenschaftlicher Konsument von Musik, Filmen, Büchern und Videospielen. Ich interessiere mich für Programmierung, 3D-Druck, Hausautomation und die Welt der Finanzen. <b>Dozent</b> und Lehrassistent. <b>Physiotherapeut</b> in meiner Freizeit.
  info:
  - title: Alter
    value: '38'
  - title: Wohnsitz
    value: Italien
  - title: Ort
    value: Lucca, Pisa, Versilia
  - title: E-Mail
    value: info@gabrielepucciarelli.com
  - title: Telefon
    value: +39 380 5334868
  services_title: Was ich <span>mache</span>
  services_left:
  - icon: lnr-wheelchair
    title: Physiotherapie
    text: Im Laufe der Jahre habe ich mich auf die Behandlung von <b>Schmerzen</b> spezialisiert, vor allem von <b>chronischen</b>. Ich behandle die Beschwerden meiner Patienten nach den neuesten wissenschaftlichen Erkenntnissen, passe die Therapie aber individuell an die Person an und setze dabei <b>Manuelle Therapie, Osteopathie, Haltungsschulung</b> und <b>therapeutische Übungen</b> ein.
  - icon: lnr-users
    title: Kommunikation
    text: Für <b>Lucca Comics and Games</b> habe ich am Twitch-Kanal des Festivals gearbeitet. Derzeit betreue ich die Kommunikation des <b>Studio di Fisioterapia e Comunicazione Kinesis.</b>
  - icon: lnr-bubble
    title: Lehre
    text: Ich gebe gerne <b>weiter</b>, was ich weiß, und habe an verschiedenen Orten Gelegenheit dazu, zum Beispiel als Lehrassistent beim <b><a href="http://masterposturologia.med.unipi.it/">Master in Klinischer Posturologie</a></b> der Universität Pisa. 2023 habe ich den Kurs <b>„Haltung, Manuelle Therapie und therapeutische Übungen“</b> im <b><a href="https://www.fisioterapia-osteopatia-r2.it/">Studio di Fisioterapia R2 in Barga</a></b> (LU) organisiert und dort unterrichtet. 2025 habe ich im Rahmen des Programms „Il Cerchio dell'Aiuto“ des Vereins <b><a href="https://www.neurocare-onlus.it/">NeuroCare</a></b> aus Pisa die Treffen zur <b>Mobilisation und zum Transfer von Patienten</b> für pflegende Angehörige von älteren und neurologisch erkrankten Menschen geleitet.
  - icon: lnr-magnifier
    title: Forschung
    text: Ohne Forschung gibt es keinen Fortschritt <small>(oder zumindest ohne den Versuch zu forschen)</small>. Ich habe am Projekt <b>MAP</b> mitgearbeitet, in Zusammenarbeit mit Dr. Paolo Bongioanni, Neurologe aus Pisa, mit dem Ziel, die Wirkung der <b>Haltungstherapie nach Mezieres</b> durch <b>die Kunst und die Emotionen</b> des Theaters und seiner Schule zu verstärken. Ich bin Zweitbetreuer mehrerer <b>Abschlussarbeiten im Master in Klinischer Posturologie</b>.
  - icon: lnr-printer
    title: 3D-Druck
    text: Der 3D-Druck verbindet die Leidenschaft für <b>Technik</b> mit <b>Kreativität</b>. Das schönste Projekt? Eine Hülle in Form eines Weckers für einen Google Home Mini <em>from scratch</em> zu entwerfen und zu drucken.
  - icon: lnr-camera-video
    title: Videomaking
    text: Ich verbringe meine Tage gerne an der frischen Luft, und ich mag es, weiterzugeben, was ich sehe. Deshalb habe ich meine Leidenschaft für das Filmen vom Boden aus und mit der <b>Drohne</b> entdeckt. Ich habe als Regisseur beim Rennen für Hybridautos <b>Economy Run</b> des Gruppo di Acquisto Ibrido mitgearbeitet und in Zusammenarbeit mit der Pro-Loco das Werbevideo für das <b>Mittelalterfest von Castiglione di Garfagnana</b> gedreht.
  services_right:
  - icon: lnr-bicycle
    title: Sport
    text: Ich war mehrere Jahre lang ein guter Athlet. Den Leistungssport habe ich aufgegeben, als ich mit dem Studium begann, aber das hat mich nicht davon abgehalten, meiner Leidenschaft als Physiotherapeut weiter nachzugehen. Ich war Physiotherapeut der <b>Fußballmannschaft von Pisa</b> und habe Salvatore Caruso und Cultrera Concetta, <b>Vizeweltmeister 2012 und Weltmeister 2013 im Tanzsport</b>, bei Wettkämpfen betreut.
  - icon: lnr-flag
    title: Management
    text: Bei verschiedenen Gelegenheiten habe ich die Rolle des Organisators übernommen. Beim Pisa Calcio war ich <b>Leiter der Physiotherapeuten im Jugendbereich</b>, und ich war der Streaming Specialist von <b>Lucca Comics and Games.</b>
  - icon: lnr-pencil
    title: Artikel und Blog
    text: Ich liebe das Schreiben. Ich bin Mitarbeiter der Zeitschrift <b>Starbene</b>, für die ich an der <b>Erstellung mehrerer Artikel</b> mitgewirkt und als Physiotherapie-Experte <b>Fragen von Patienten</b> beantwortet habe. Früher habe ich für <b>Skimbu</b>, einen Technik-Blog, mehrere Artikel über Kino, künstliche Intelligenz und Software geschrieben. In jüngerer Zeit habe ich Artikel für die Website von Kinesis geschrieben, der Physiotherapiepraxis, mit der ich zusammenarbeite.
  - icon: lnr-home
    title: Hausautomation
    text: Wusstest du, dass mein Haus sprechen kann? Es schaltet Lichter und Haushaltsgeräte auf Befehl ein und aus. Es öffnet und schließt die Markisen je nach Wetter. Es warnt, wenn eine Tür oder ein Fenster offen geblieben ist, während die Heizung angeht (auch die Heizung ist smart). Es hat jede Menge smarte Funktionen, die das Leben <b>einfacher</b> machen und helfen, <b>Energie zu sparen</b>... und alle von mir programmiert!
  - icon: lnr-code
    title: Programmierung
    text: Ich liebe es, meine Routinen zu optimieren, und die Technik hilft mir dabei. Wie das Stück Code, das ich geschrieben habe, um <b>meine Patienten an ihren Termin</b> am nächsten Tag zu erinnern. Einmal habe ich einer <b>Künstlichen Intelligenz</b> beigebracht, Tic-Tac-Toe zu spielen. Heute entwickle ich Webanwendungen wie <b>Tonight</b>, das Filme und Serien auf Grundlage dessen empfiehlt, was du gesehen hast, und <b>Mister!</b>, ein Fantasy-Fußballspiel, das die Spiele Minute für Minute simuliert; ich habe <b>Bussola</b> entwickelt, das die Länder der Welt in 3D auf den Political Compass setzt, <b>Lighthouse</b>, ein kleines Open-Source-Programm für Windows, und <b>Playshelf</b>, das die Playnite-Bibliothek auf jeden PC bringt. Außerdem baue ich Automatisierungen mit künstlicher Intelligenz, für E-Mails, Rechnungen und Aufgaben. Und wi<small>e damals, <small>als i<small>ch...</small></small></small>
  testimonials_title: Referenzen
  testimonials_cta: Möchtest du auch eine Bewertung hinterlassen?
