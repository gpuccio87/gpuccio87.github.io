  services_title: Qué <span>hago</span>
  services_left:
  - icon: lnr-wheelchair
    title: Fisioterapia
    text: Con los años me he especializado en el tratamiento del <b>dolor</b>, sobre todo <b>crónico</b>. Trato los problemas de mis pacientes según la investigación científica más reciente, pero personalizando el tratamiento para cada persona, con <b>Terapia Manual, Osteopatía, Reeducación Postural</b> y <b>Ejercicio terapéutico</b>.
