  - icon: lnr-bubble
    title: Docencia
    text: Me gusta <b>divulgar</b> lo que sé, y tengo ocasión de hacerlo en distintos lugares, por ejemplo como asistente de docencia en el <b><a href="http://masterposturologia.med.unipi.it/">Máster de Posturología Clínica</a></b> de la Universidad de Pisa. En 2023 organicé e impartí el curso <b>"Postura, Terapia Manual y Ejercicio Terapéutico"</b> en el <b><a href="https://www.fisioterapia-osteopatia-r2.it/">Studio di Fisioterapia R2 de Barga</a></b> (LU). En 2025 impartí los encuentros sobre la <b>movilización y los traslados del paciente</b> para cuidadores de personas mayores y enfermos neurológicos, dentro del programa "Il Cerchio dell'Aiuto" de la asociación <b><a href="https://www.neurocare-onlus.it/">NeuroCare</a></b> de Pisa.
  - icon: lnr-magnifier
    title: Investigación
    text: No hay mejora sin investigación <small>(o, al menos, sin intento de investigación)</small>. He trabajado en el proyecto <b>MAP</b>, en colaboración con el Dr. Paolo Bongioanni, neurólogo de Pisa, con el objetivo de amplificar los efectos de la <b>terapia postural Mézières</b> mediante <b>el arte y las emociones</b> del teatro y de su escuela. Soy codirector de varias <b>Tesis del Máster de Posturología Clínica</b>.
  - icon: lnr-printer
    title: Impresión 3D
    text: La impresión 3D permite unir la pasión por la <b>tecnología</b> y la <b>creatividad</b>. ¿El proyecto más bonito? Diseñar e imprimir <em>from scratch</em> una carcasa con forma de despertador para un Google Home Mini.
  - icon: lnr-camera-video
    title: Videomaking
    text: Me gusta pasar el día al aire libre, y me gusta transmitir lo que veo. Por eso me apasioné por el videomaking desde tierra y con <b>dron</b>. Colaboré como director en la carrera para coches híbridos <b>Economy Run</b> del Gruppo di Acquisto Ibrido, y realicé el vídeo promocional de la <b>Fiesta Medieval de Castiglione di Garfagnana</b>, en colaboración con la Pro-Loco.
