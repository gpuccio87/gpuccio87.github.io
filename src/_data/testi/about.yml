    title: Domótica
    text: ¿Sabías que mi casa puede hablar? Enciende y apaga a la orden las luces y los electrodomésticos. Abre y cierra los toldos según el tiempo. Avisa si una puerta o una ventana se ha quedado abierta cuando se enciende la calefacción (la calefacción también es inteligente). Tiene un montón de funciones inteligentes, que <b>simplifican</b> la vida y permiten <b>ahorrar energía</b>... ¡y todas programadas por mí!
