    text: Me encanta optimizar mis rutinas, y la tecnología me ayuda en ello. Como aquel trozo de código que escribí para <b>recordar a mis pacientes la cita</b> del día siguiente. Una vez enseñé a una <b>Inteligencia Artificial</b> a jugar al tres en raya. Hoy desarrollo aplicaciones web como <b>Tonight</b>, que recomienda películas y series a partir de lo que has visto, y <b>Mister!</b>, un fútbol fantasy que simula los partidos minuto a minuto; he creado <b>Bussola</b>, que sitúa las naciones del mundo en el political compass en 3D, <b>Lighthouse</b>, un pequeño programa open source para Windows, y <b>Playshelf</b>, que lleva la biblioteca de Playnite a cada PC. También construyo automatizaciones con inteligencia artificial, para el correo, las facturas y las tareas. Y co<small>mo aquella <small>vez q<small>ue...</small></small></small>
