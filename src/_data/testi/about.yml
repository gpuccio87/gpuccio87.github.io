fr:
  title: Qui <span>suis-je</span>
  intro: "Un <i>geek</i>, au fond. J'aime trouver des <b>solutions intelligentes</b> aux problèmes des gens. Je suis extrêmement curieux et <small><small>excessivement</small></small> organisé. Grand consommateur de musique, de films, de livres et de jeux vidéo. Je m'intéresse à la programmation, à l'impression 3D, à la domotique et au monde de la finance. <b>Enseignant</b> et assistant d'enseignement. <b>Kinésithérapeute</b> à mes heures perdues."
  info:
  - title: Âge
    value: '38'
  - title: Résidence
    value: Italie
  - title: Lieu
    value: Lucca, Pisa, Versilia
  - title: E-mail
    value: info@gabrielepucciarelli.com
  - title: Téléphone
    value: +39 380 5334868
  services_title: Ce que <span>je fais</span>
  services_left:
  - icon: lnr-wheelchair
    title: Kinésithérapie
    text: "Au fil des années, je me suis spécialisé dans le traitement de la <b>douleur</b>, surtout <b>chronique</b>. Je soigne les problèmes de mes patients en suivant les recherches scientifiques les plus récentes, tout en adaptant le traitement à chaque personne, avec la <b>Thérapie manuelle, l'Ostéopathie, la Rééducation posturale</b> et l'<b>Exercice thérapeutique</b>."
  - icon: lnr-users
    title: Communication
    text: "Avec <b>Lucca Comics and Games</b>, j'ai travaillé sur la chaîne Twitch du Festival. Aujourd'hui, je m'occupe de la communication du <b>Studio di Fisioterapia e Comunicazione Kinesis.</b>"
  - icon: lnr-bubble
    title: Enseignement
    text: "J'aime <b>transmettre</b> ce que je sais, et j'ai l'occasion de le faire dans différents cadres, par exemple comme assistant d'enseignement au <b><a href=\"http://masterposturologia.med.unipi.it/\">Master di Posturologia Clinica</a></b> de l'Université de Pise. En 2023, j'ai organisé le cours <b>« Posture, thérapie manuelle et exercice thérapeutique »</b>, dont j'ai été l'enseignant, au <b><a href=\"https://www.fisioterapia-osteopatia-r2.it/\">Studio di Fisioterapia R2 de Barga</a></b> (LU). En 2025, j'ai animé les rencontres sur la <b>mobilisation et les déplacements du patient</b> destinées aux aidants de personnes âgées et de malades neurologiques, dans le parcours « Il Cerchio dell'Aiuto » de l'association <b><a href=\"https://www.neurocare-onlus.it/\">NeuroCare</a></b> de Pise."
  - icon: lnr-magnifier
    title: Recherche
    text: "Pas de progrès sans recherche <small>(ou, du moins, sans tentative de recherche)</small>. J'ai travaillé sur le projet <b>MAP</b>, en collaboration avec le Dr Paolo Bongioanni, neurologue à Pise, dans le but d'amplifier les effets de la <b>thérapie posturale Mézières</b> grâce à <b>l'art et aux émotions</b> du théâtre et de son école. Je suis co-directeur de plusieurs <b>mémoires du Master di Posturologia Clinica</b>."
  - icon: lnr-printer
    title: Impression 3D
    text: "L'impression 3D permet de réunir la passion pour la <b>technologie</b> et la <b>créativité</b>. Mon plus beau projet ? Dessiner et imprimer <em>from scratch</em> une coque en forme de réveil pour un Google Home Mini."
  - icon: lnr-camera-video
    title: Vidéo
    text: "J'aime passer la journée en plein air, et j'aime partager ce que je vois. C'est pour ça que je me suis passionné pour la vidéo, au sol et avec un <b>drone</b>. J'ai été réalisateur pour la course de voitures hybrides <b>Economy Run</b> du Gruppo di Acquisto Ibrido, et j'ai réalisé la vidéo promotionnelle de la <b>Fête médiévale de Castiglione di Garfagnana</b>, en collaboration avec la Pro Loco."
  services_right:
  - icon: lnr-bicycle
    title: Sport
    text: "J'ai été un bon athlète pendant plusieurs années. J'ai abandonné le sport de compétition en entrant à l'université, mais cela ne m'a pas empêché de continuer à suivre ma passion en tant que kinésithérapeute. J'ai été kinésithérapeute de l'équipe de <b>football de Pise</b> et j'ai accompagné en compétition Salvatore Caruso et Cultrera Concetta, <b>vice-champions du monde 2012 et champions du monde 2013 de danse sportive</b>."
  - icon: lnr-flag
    title: Management
    text: "J'ai endossé le rôle d'organisateur à plusieurs reprises. Au Pisa Calcio, j'ai été <b>responsable des kinésithérapeutes du secteur jeunes</b>, et j'ai été le Streaming Specialist de <b>Lucca Comics and Games.</b>"
  - icon: lnr-pencil
    title: Articles et blog
    text: "J'adore écrire. Je collabore avec le magazine <b>Starbene</b>, pour lequel j'ai participé à la <b>rédaction de plusieurs articles</b> et répondu aux <b>questions des patients</b> en tant qu'expert kinésithérapeute. Par le passé, j'ai écrit plusieurs articles sur le cinéma, l'intelligence artificielle et les logiciels pour <b>Skimbu</b>, un blog de technologie. Plus récemment, j'ai écrit des articles pour le site de Kinesis, le cabinet de kinésithérapie avec lequel je collabore."
  - icon: lnr-home
    title: Domotique
    text: "Saviez-vous que ma maison sait parler ? Elle allume et éteint sur commande les lumières et les appareils électroménagers. Elle ouvre et ferme les stores selon la météo. Elle prévient si une porte ou une fenêtre est restée ouverte quand le chauffage s'allume (le chauffage aussi est intelligent). Elle a plein de fonctions intelligentes, qui <b>simplifient</b> la vie et permettent d'<b>économiser de l'énergie</b>... et toutes programmées par moi !"
  - icon: lnr-code
    title: Programmation
    text: "J'adore optimiser mes routines, et la technologie m'y aide. Comme ce bout de code que j'ai écrit pour <b>rappeler à mes patients leur rendez-vous</b> du lendemain. Un jour, j'ai appris à une <b>Intelligence Artificielle</b> à jouer au morpion. Aujourd'hui, je développe des applications web comme <b>Tonight</b>, qui recommande des films et des séries à partir de ce que vous avez vu, et <b>Mister!</b>, un fantasy football qui simule les matchs minute par minute ; j'ai créé <b>Bussola</b>, qui place les pays du monde sur le political compass en 3D, <b>Lighthouse</b>, un petit programme open source pour Windows, et <b>Playshelf</b>, qui apporte votre bibliothèque Playnite sur chaque PC. Je construis aussi des automatisations avec l'intelligence artificielle, pour les e-mails, les factures et les tâches. Et co<small>mme cette <small>fois o<small>ù...</small></small></small>"
  testimonials_title: Témoignages
  testimonials_cta: Vous voulez laisser votre témoignage ?
  testimonials_cta_label: Cliquez ici !
  testimonials_form: https://docs.google.com/forms/d/e/1FAIpQLSdof2aCfCTdtqLev0a6VndNIxx_N8ksG0408j18Z5lbiLQTAQ/viewform
  testimonials:
  - name: Luca Canessa
    role: Patient - Pise
    image: img/testimonials/testimonial-1.jpg
    text: "J'ai connu Gabriele il y a quelques années dans le cadre de mon activité sportive. Il m'a très bien traité, tant sur le plan professionnel qu'humain ; depuis, je ne l'ai plus quitté, car je le considère comme un kinésithérapeute compétent et capable, au point de le recommander à mes amis et à ma famille."
  - name: Dott. Luigi Nicoletti
    role: Enseignant au Master di Posturologia Clinica - UniPi
    image: img/testimonials/testimonial-2.jpg
    text: "J'ai rarement trouvé des collaborateurs aussi compétents, précis et ponctuels"
  - name: Dott. Federico Rocchiccioli
    role: Kinésithérapeute - Titulaire du Studio R2
    image: img/testimonials/testimonial-3.jpg
    text: "Le Dr Pucciarelli est un professeur très compétent ; j'ai suivi avec lui plusieurs cours sur les chaînes musculaires. La partie théorique est toujours suivie d'une partie pratique conséquente, qui vous apprend de nombreuses façons de résoudre le problème du patient"
  - name: Dott. Deya Watad
    role: Kinésithérapeute
    image: img/testimonials/testimonial-4.jpg
    text: "Le Dr Pucciarelli a d'excellentes capacités de communication. Les cours reposent sur les dernières données scientifiques, accompagnées d'une large partie pratique. J'ai obtenu des résultats vraiment satisfaisants dans le traitement des problèmes de mes patients"
  - name: Dott.ssa Lucia Vanni
    role: Kinésithérapeute
    image: img/testimonials/testimonial-5.jpg
    text: "J'ai eu le plaisir de passer une journée de formation avec lui. J'ai pu constater à quel point c'est un professionnel sérieux et compétent, doté de qualités de communication peu communes"
