  testimonials:
  - name: Luca Canessa
    role: Patient - Pisa
    image: img/testimonials/testimonial-1.jpg
    text: Ich habe Gabriele vor einigen Jahren im Rahmen meiner sportlichen Aktivität kennengelernt. Er hat mich sowohl fachlich als auch menschlich hervorragend behandelt; seitdem bin ich ihm treu geblieben, denn ich halte ihn für einen kompetenten und fähigen Physiotherapeuten, so sehr, dass ich ihn Freunden und Verwandten empfehle.
  - name: Dott. Luigi Nicoletti
    role: Dozent im Master in Klinischer Posturologie - UniPi
    image: img/testimonials/testimonial-2.jpg
    text: Selten habe ich so kompetente, genaue und zuverlässige Mitarbeiter gefunden
  - name: Dott. Federico Rocchiccioli
    role: Physiotherapeut - Inhaber Studio R2
    image: img/testimonials/testimonial-3.jpg
    text: Dr. Pucciarelli ist ein sehr kompetenter Dozent, ich habe bei ihm einige Kurse über Muskelketten besucht. Auf den theoretischen Teil folgt immer ein umfangreicher praktischer Teil, der dir viele Wege zeigt, das Problem des Patienten zu lösen
  - name: Dott. Deya Watad
    role: Physiotherapeut
    image: img/testimonials/testimonial-4.jpg
    text: Dr. Pucciarelli hat hervorragende kommunikative Fähigkeiten. Der Unterricht basiert auf den neuesten wissenschaftlichen Erkenntnissen und wird von einem umfangreichen praktischen Teil begleitet. Bei der Behandlung der Beschwerden meiner Patienten habe ich wirklich zufriedenstellende Ergebnisse erzielt
  - name: Dott.ssa Lucia Vanni
    role: Physiotherapeutin
    image: img/testimonials/testimonial-5.jpg
    text: Ich hatte das Vergnügen, einen Fortbildungstag mit ihm zu verbringen. Dabei habe ich festgestellt, wie seriös und kompetent er als Fachmann ist, mit ungewöhnlichen kommunikativen Fähigkeiten
