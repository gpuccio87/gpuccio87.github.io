en:
  title: About <span>me</span>
  intro: Basically a <i>geek</i>. I like finding <b>smart solutions</b> to people's problems. I'm extremely curious and <small><small>excessively</small></small> organized. A voracious consumer of music, films, books and video games. I'm into programming, 3D printing, home automation and the world of finance. <b>Teacher</b> and teaching assistant. <b>Physiotherapist</b> in my spare time.
  info:
  - title: Age
    value: '38'
  - title: Residence
    value: Italy
  - title: Location
    value: Lucca, Pisa, Versilia
  - title: Email
    value: info@gabrielepucciarelli.com
  - title: Phone
    value: +39 380 5334868
  services_title: What <span>I do</span>
  services_left:
  - icon: lnr-wheelchair
    title: Physiotherapy
    text: Over the years I have specialized in treating <b>pain</b>, especially <b>chronic</b> pain. I treat my patients' problems according to the latest scientific research, while tailoring the treatment to the person, using <b>Manual Therapy, Osteopathy, Postural Rehabilitation</b> and <b>Therapeutic Exercise</b>.
  - icon: lnr-users
    title: Communication
    text: With <b>Lucca Comics and Games</b> I worked on the Festival's Twitch channel. I currently manage communication for the <b>Kinesis Physiotherapy and Communication Studio.</b>
  - icon: lnr-bubble
    title: Teaching
    text: I like <b>sharing</b> what I know, and I get the chance to do it in several places, for example as a teaching assistant on the <b><a href="http://masterposturologia.med.unipi.it/">Master's in Clinical Posturology</a></b> at the University of Pisa. In 2023 I organized and taught the course <b>"Posture, Manual Therapy and Therapeutic Exercise"</b> at the <b><a href="https://www.fisioterapia-osteopatia-r2.it/">R2 Physiotherapy Studio in Barga</a></b> (LU). In 2025 I led the sessions on <b>patient mobilization and transfers</b> for caregivers of elderly and neurological patients, as part of the "Il Cerchio dell'Aiuto" program run by the <b><a href="https://www.neurocare-onlus.it/">NeuroCare</a></b> association in Pisa.
  - icon: lnr-magnifier
    title: Research
    text: There is no improvement without research <small>(or, at least, without an attempt at research)</small>. I worked on the <b>MAP</b> project, together with Dr. Paolo Bongioanni, a neurologist in Pisa, with the aim of amplifying the effects of <b>Mezieres postural therapy</b> through <b>the art and emotions</b> of theatre and its school. I am co-supervisor of several <b>theses for the Master's in Clinical Posturology</b>.
  - icon: lnr-printer
    title: 3D Printing
    text: 3D printing lets me combine my passion for <b>technology</b> and <b>creativity</b>. My favourite project? Designing and printing <em>from scratch</em> an alarm-clock-shaped cover for a Google Home Mini.
  - icon: lnr-camera-video
    title: Videomaking
    text: I love spending the day outdoors, and I love sharing what I see. That's why I got hooked on videomaking, both from the ground and with a <b>drone</b>. I worked as director for the <b>Economy Run</b> hybrid car race organized by the Gruppo di Acquisto Ibrido, and I made the promotional video for the <b>Medieval Festival of Castiglione di Garfagnana</b>, together with the Pro-Loco.
  services_right:
  - icon: lnr-bicycle
    title: Sport
    text: I was a pretty good athlete for several years. I gave up competitive sport when I started university, but that didn't stop me from following my passion as a Physiotherapist. I was the physiotherapist for the <b>Pisa football team</b> and I followed Salvatore Caruso and Cultrera Concetta at competitions, <b>2012 world runners-up and 2013 world champions in DanceSport</b>.
  - icon: lnr-flag
    title: Management
    text: I have taken on the role of organizer on several occasions. At Pisa Calcio I was <b>Head of Physiotherapists for the youth academy</b>, and I was the Streaming Specialist for <b>Lucca Comics and Games.</b>
  - icon: lnr-pencil
    title: Articles and Blog
    text: I love writing. I contribute to <b>Starbene</b> magazine, for which I have <b>written several articles</b> and answered <b>patients' questions</b> as an Expert Physiotherapist. In the past I wrote several articles about cinema, artificial intelligence and software for <b>Skimbu</b>, a tech blog. More recently I have written articles for the website of Kinesis, the physiotherapy studio I work with.
  - icon: lnr-home
    title: Home Automation
    text: Did you know my house can talk? It switches lights and appliances on and off on command. It opens and closes the awnings depending on the weather. It warns me if a door or window has been left open when the heating comes on (the heating is smart too). It has loads of smart features that <b>make life easier</b> and help <b>save energy</b>... and I programmed them all myself!
  - icon: lnr-code
    title: Programming
    text: I love optimizing my routines, and technology helps me do it. Like that piece of code I wrote to <b>remind my patients of their appointment</b> the next day. Once I taught an <b>Artificial Intelligence</b> to play Tic-Tac-Toe. Today I develop web applications like <b>Tonight</b>, which recommends films and series based on what you've watched, and <b>Mister!</b>, a fantasy football game that simulates matches minute by minute; I created <b>Bussola</b>, which puts the countries of the world on a 3D political compass, <b>Lighthouse</b>, a small open source program for Windows, and <b>Playshelf</b>, which brings your Playnite library to every PC. I also build automations with artificial intelligence, for email, invoices and tasks. And li<small>ke that <small>time w<small>hen...</small></small></small>
  testimonials_title: Testimonials
  testimonials_cta: Would you like to leave a testimonial?
  testimonials_cta_label: Click here!
  testimonials_form: https://docs.google.com/forms/d/e/1FAIpQLSdof2aCfCTdtqLev0a6VndNIxx_N8ksG0408j18Z5lbiLQTAQ/viewform
  testimonials:
  - name: Luca Canessa
    role: Patient - Pisa
    image: img/testimonials/testimonial-1.jpg
    text: I met Gabriele a few years ago through my sporting activity. He treated me extremely well, both professionally and personally; I've never left him since, because I consider him a well-trained and capable physiotherapist, so much so that I recommend him to friends and family.
  - name: Dott. Luigi Nicoletti
    role: Lecturer, Master's in Clinical Posturology - UniPi
    image: img/testimonials/testimonial-2.jpg
    text: I have rarely found collaborators so well prepared, precise and punctual
  - name: Dott. Federico Rocchiccioli
    role: Physiotherapist - Owner of Studio R2
    image: img/testimonials/testimonial-3.jpg
    text: Dr. Pucciarelli is a very knowledgeable teacher; I attended some of his courses on muscle chains. The theory is always followed by a substantial practical part that teaches you many ways to solve the patient's problem
  - name: Dott. Deya Watad
    role: Physiotherapist
    image: img/testimonials/testimonial-4.jpg
    text: Dr. Pucciarelli has excellent communication skills. His lessons are based on the latest scientific evidence, along with an extensive practical part. I have seen truly satisfying results in treating my patients' problems
  - name: Dott.ssa Lucia Vanni
    role: Physiotherapist
    image: img/testimonials/testimonial-5.jpg
    text: I had the pleasure of spending a training day with him. I saw what a serious and competent professional he is, with uncommon communication skills
