testimonials:
- name: Luca Canessa
  role: Paziente - Pisa
  image: img/testimonials/testimonial-1.jpg
  text: Ho conosciuto Gabriele qualche anno fa nell’ambito della mia attività sportiva. Mi ha trattato benissimo sia a livello professionale che umano; da allora non l'ho più abbandonato, in quanto lo ritengo un fisioterapista preparato e capace, tanto da consigliarlo ad amici e a parenti.
- name: Dott. Luigi Nicoletti
  role: Docente Master Posturologia Clinica - UniPi
  image: img/testimonials/testimonial-2.jpg
  text: Raramente ho trovato collaboratori così preparati, precisi e puntuali
- name: Dott. Federico Rocchiccioli
  role: Fisioterapista - Titolare Studio R2
  image: img/testimonials/testimonial-3.jpg
  text: Il Dott. Pucciarelli è un professore molto preparato, ho seguito con lui alcuni corsi sulle catene muscolari. La parte teorica è sempre seguita da una corposa parte pratica che ti insegna molti modi per risolvere il problema del paziente
- name: Dott. Deya Watad
  role: Fisioterapista
  image: img/testimonials/testimonial-4.jpg
  text: Il Dott. Pucciarelli ha ottime capacità comunicative. Le lezioni si basano sulle ultime evidenze scientifiche accompagnate da una vasta parte pratica. Ho riscontrato risultati davvero soddisfacenti nel trattamento delle problematiche dei pazienti
- name: Dott.ssa Lucia Vanni
  role: Fisioterapista
  image: img/testimonials/testimonial-5.jpg
  text: Ho avuto il piacere di passare una giornata di formazione con lui. Ho constatato quanto sia un professionista serio e competente con doti comunicative non comuni
